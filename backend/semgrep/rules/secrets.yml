rules:
  - id: dpa-hardcoded-credential
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      La credencial "$KEY" está escrita directamente en el código. Cualquier
      persona con acceso al repositorio puede leerla.
    options:
      # Sin esto, cada uso de la variable repite el hallazgo de su declaración.
      constant_propagation: false
    patterns:
      - pattern-either:
          - pattern: $KEY = "$VALUE"
          - pattern: '{..., $KEY: "$VALUE", ...}'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^[\w.]*(password|passwd|pwd|secret|api_?key|access_?token|auth_?token|private_?key)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{6,}$
    metadata:
      dpa-code: DPA-SEC-001
      title: Credenciales escritas en el código
      category: secrets
      dpa-severity: critical
      remediation: >-
        Mover el valor a una variable de entorno o a un gestor de secretos, y
        rotar la credencial expuesta.

  - id: dpa-hardcoded-credential-python
    languages: [python]
    severity: ERROR
    message: >-
      La credencial "$KEY" está escrita directamente en el código. Cualquier
      persona con acceso al repositorio puede leerla.
    patterns:
      - pattern: $KEY = "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^[\w.]*(password|passwd|pwd|secret|api_?key|access_?token|auth_?token|private_?key)$
      - metavariable-regex:

          regex: ^.{6,}$
    metadata:
      dpa-code: DPA-SEC-001
      title: Credenciales escritas en el código
      category: secrets
      dpa-severity: critical
      remediation: >-
        Mover el valor a una variable de entorno o a un gestor de secretos, y
        rotar la credencial expuesta.

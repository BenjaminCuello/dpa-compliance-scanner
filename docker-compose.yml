services:
  db:
    image: postgres:16-alpine
    container_name: dpa_scanner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-scanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scanner_local}
      POSTGRES_DB: ${DB_NAME:-dpa_scanner}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-scanner} -d ${DB_NAME:-dpa_scanner}']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: production
    container_name: dpa_scanner_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-scanner}
      DB_PASSWORD: ${DB_PASSWORD:-scanner_local}
      DB_NAME: ${DB_NAME:-dpa_scanner}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_LOGGING: ${DB_LOGGING:-false}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET en el archivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      SEMGREP_TIMEOUT_MS: ${SEMGREP_TIMEOUT_MS:-300000}
      SCANNER_WORKSPACE_DIR: ${SCANNER_WORKSPACE_DIR:-/tmp/dpa-scanner}
      AUDIT_ALLOWED_GIT_HOSTS: ${AUDIT_ALLOWED_GIT_HOSTS:-github.com,gitlab.com,bitbucket.org}
      AUDIT_CLONE_TIMEOUT_MS: ${AUDIT_CLONE_TIMEOUT_MS:-120000}
      AUDIT_MAX_REPOSITORY_MB: ${AUDIT_MAX_REPOSITORY_MB:-200}
      AUDIT_MAX_CONCURRENT: ${AUDIT_MAX_CONCURRENT:-2}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
